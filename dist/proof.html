<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Original-pixel parallax proof</title><style>body{background:#20271f;color:#eee;font:16px system-ui;text-align:center}#scene{position:relative;width:min(80vw,660px);aspect-ratio:1320/1422;margin:auto;overflow:hidden}img{position:absolute;inset:0;width:100%;height:100%}</style><h1>Original-pixel parallax proof</h1><p>Move over the illustration. Leave it to restore the exact composition. No ambient animation.</p><div id="scene"><img src="assets/forest.png"><img data-depth="1" src="assets/great-mushroom.png"><img data-depth="3" src="assets/foreground-mushroom.png"><img data-depth="2" src="assets/fox.png"><img data-depth="2" src="assets/ear.png"></div><script>const s=document.querySelector('#scene'),layers=[...s.querySelectorAll('[data-depth]')];function move(x,y){layers.forEach(l=>l.style.transform=`translate(${x*l.dataset.depth}px,${y*l.dataset.depth}px)`)}s.onpointermove=e=>{let r=s.getBoundingClientRect();move((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5)};s.onpointerleave=()=>move(0,0);</script></html>
